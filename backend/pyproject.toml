[project]
name = "cadpilot-api"
version = "0.1.0"
description = "Text-to-CAD API and orchestration service"
requires-python = ">=3.11,<3.15"
dependencies = [
  "celery[redis]>=5.4,<6",
  "fastapi>=0.115,<1",
  "langgraph>=0.2,<1",
  "langgraph-checkpoint-postgres>=2,<3",
  "mcp>=1.6,<2",
  "openai>=1.0,<3",
  "pydantic-settings>=2.6,<3",
  "psycopg[binary]>=3.2,<4",
  "sqlalchemy>=2.0,<3",
  "trimesh>=4.5,<5",
  "uvicorn[standard]>=0.32,<1",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=8.3,<9", "pytest-asyncio>=0.25,<1", "ruff>=0.8,<1"]
evals = ["langsmith>=0.2,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100
