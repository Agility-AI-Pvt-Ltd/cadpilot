services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    environment:
      CAD_STORAGE_ROOT: /data/storage
    volumes:
      - ./storage:/data/storage
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  cad-worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
      args:
        FREECAD_REF: ${FREECAD_REF:-main}
        FREECAD_BUILD_JOBS: ${FREECAD_BUILD_JOBS:-2}
    env_file: .env
    environment:
      CAD_STORAGE_ROOT: /data/storage
    volumes:
      - ./storage:/data/storage
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "freecadcmd", "-c", "import FreeCAD; print(FreeCAD.Version())"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cadpilot
      POSTGRES_USER: cadpilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cadpilot}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cadpilot -d cadpilot"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: ./frontend
    depends_on:
      - api

  gateway:
    image: caddy:2.8-alpine
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "80:80"
    depends_on:
      - web
      - api

volumes:
  postgres_data:
